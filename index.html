<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supermarket Billing System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Retail POS</p>
          <h1>Supermarket Billing System</h1>
        </div>
        <button class="secondary" id="resetBtn" type="button">Reset Bill</button>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Add Product</h2>

          <div class="form-grid">
            <label>
              Product Name
              <input id="productName" type="text" placeholder="e.g. Rice" />
            </label>

            <label>
              Quantity
              <input id="quantity" type="number" min="1" value="1" />
            </label>

            <label>
              Price (₹)
              <input id="price" type="number" min="0" step="0.01" placeholder="0.00" />
            </label>

            <label>
              Discount (%)
              <input id="discount" type="number" min="0" max="100" value="0" />
            </label>
          </div>

          <button id="addBtn" class="primary" type="button">Add Item</button>
        </section>

        <section class="panel bill-panel">
          <div class="bill-header">
            <div>
              <p class="eyebrow">Customer Bill</p>
              <h2>Invoice</h2>
            </div>
            <button class="secondary" id="printBtn" type="button">Print Bill</button>
          </div>

          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Discount</th>
                <th>Total</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="billItems"></tbody>
          </table>

          <div class="empty-state hidden" id="emptyState">
            No products added yet.
          </div>

          <div class="summary">
            <div class="summary-row">
              <span>Subtotal</span>
              <strong id="subtotal">₹0.00</strong>
            </div>
            <div class="summary-row">
              <span>Discount</span>
              <strong id="discountTotal">₹0.00</strong>
            </div>
            <div class="summary-row grand-total">
              <span>Grand Total</span>
              <strong id="grandTotal">₹0.00</strong>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
